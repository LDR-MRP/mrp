name: PR Code Validation (CI)

on:
  pull_request:
    branches:
      - staging
      - main

jobs:
  php-validation:
    name: Validate PHP Syntax & Composer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, gd, ctype, json
          coverage: none

      - name: Validate Composer Configuration
        run: composer validate --no-check-publish

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-suggest

      - name: Check PHP Syntax Errors (Lint)
        run: |
          echo "Scanning PHP files for syntax errors..."
          find . -type f -name "*.php" ! -path "./vendor/*" ! -path "./Uploads/*" -exec php -l {} \; | grep -v "No syntax errors detected" && exit 1 || echo "All PHP files passed syntax check successfully."
