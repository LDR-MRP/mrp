server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 100M;

    # Redirigir la raíz / a /mrp/
    location = / {
        return 301 /mrp/;
    }

    # Procesar la ruta /mrp/
    location /mrp/ {
        try_files $uri $uri/ /mrp/index.php?url=$uri&$args;
    }

    location / {
        try_files $uri $uri/ /mrp/index.php?url=$uri&$args;
    }

    # Procesar peticiones PHP mediante PHP-FPM
    location ~ \.php$ {
        fastcgi_pass mrp-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquear acceso a archivos ocultos (.git, .env, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
